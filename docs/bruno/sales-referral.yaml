meta:
  name: Sales Referral
  type: collection
  scope: api
  description: Sales referral admin and public validation endpoints.

vars:
  base_url: http://localhost:8080/api/v1
  token: ""
  csrf_token: ""

requests:
  - name: Validate Registration Code
    method: GET
    url: "{{base_url}}/auth/registration-codes/validate?code=BUDI-JAN&email=buyer@example.com"
    headers:
      X-CSRF-Token: "{{csrf_token}}"
    auth:
      type: bearer
      token: "{{token}}"

  - name: Register Tenant With Referral
    method: POST
    url: "{{base_url}}/auth/register"
    headers:
      Content-Type: application/json
      X-CSRF-Token: "{{csrf_token}}"
    auth:
      type: bearer
      token: "{{token}}"
    body:
      name: Alice Demo
      email: alice@example.com
      password: Password123!
      company_name: Alice Demo Inc
      agree_tos: true
      agree_marketing: false
      registration_code: BUDI-JAN

  - name: List Referral Accounts
    method: GET
    url: "{{base_url}}/internal/referrals/accounts?page=1&per_page=20"
    auth:
      type: bearer
      token: "{{token}}"

  - name: Create Referral Account
    method: POST
    url: "{{base_url}}/internal/referrals/accounts"
    headers:
      Content-Type: application/json
      X-CSRF-Token: "{{csrf_token}}"
    auth:
      type: bearer
      token: "{{token}}"
    body:
      email: sales@example.com
      name: Sales Team
      is_active: true

  - name: List Referral Codes
    method: GET
    url: "{{base_url}}/internal/referrals/codes?page=1&per_page=20"
    auth:
      type: bearer
      token: "{{token}}"

  - name: Create Referral Code
    method: POST
    url: "{{base_url}}/internal/referrals/codes"
    headers:
      Content-Type: application/json
      X-CSRF-Token: "{{csrf_token}}"
    auth:
      type: bearer
      token: "{{token}}"
    body:
      sales_referral_account_id: "{{sales_referral_account_id}}"
      coupon_id: "{{coupon_id}}"
      code: BUDI-JAN
      max_uses: 100
      max_uses_per_email: 1

  - name: Referral Stats
    method: GET
    url: "{{base_url}}/internal/referrals/stats"
    auth:
      type: bearer
      token: "{{token}}"

  - name: Get Commission Config
    method: GET
    url: "{{base_url}}/internal/referrals/commission-config"
    auth:
      type: bearer
      token: "{{token}}"

  - name: Update Commission Config
    method: PUT
    url: "{{base_url}}/internal/referrals/commission-config"
    headers:
      Content-Type: application/json
      X-CSRF-Token: "{{csrf_token}}"
    auth:
      type: bearer
      token: "{{token}}"
    body:
      default_close_commission_bps: 1000
      default_recurring_commission_bps: 500

  - name: List Referral Commissions
    method: GET
    url: "{{base_url}}/internal/referrals/commissions?page=1&per_page=20&status=pending"
    auth:
      type: bearer
      token: "{{token}}"

  - name: Get Referral Commission Detail
    method: GET
    url: "{{base_url}}/internal/referrals/commissions/{{referral_commission_id}}"
    auth:
      type: bearer
      token: "{{token}}"

  - name: Approve Referral Commission
    method: POST
    url: "{{base_url}}/internal/referrals/commissions/{{referral_commission_id}}/approve"
    headers:
      X-CSRF-Token: "{{csrf_token}}"
    auth:
      type: bearer
      token: "{{token}}"

  - name: Void Referral Commission
    method: POST
    url: "{{base_url}}/internal/referrals/commissions/{{referral_commission_id}}/void"
    headers:
      Content-Type: application/json
      X-CSRF-Token: "{{csrf_token}}"
    auth:
      type: bearer
      token: "{{token}}"
    body:
      reason: Refund before payout

  - name: List Referral Payouts
    method: GET
    url: "{{base_url}}/internal/referrals/payouts?page=1&per_page=20"
    auth:
      type: bearer
      token: "{{token}}"

  - name: Create Referral Payout
    method: POST
    url: "{{base_url}}/internal/referrals/payouts"
    headers:
      Content-Type: application/json
      X-CSRF-Token: "{{csrf_token}}"
    auth:
      type: bearer
      token: "{{token}}"
    body:
      sales_referral_account_id: "{{sales_referral_account_id}}"
      commission_ids:
        - "{{referral_commission_id}}"
      paid_at: "2026-06-10T00:00:00Z"
      payment_reference: MANUAL-001
      notes: Manual bank transfer
