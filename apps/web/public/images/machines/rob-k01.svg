  <circle cx="60" cy="80" r="14" fill="#2d3748"/>
  <rect x="35" y="92" width="50" height="4" fill="#0f172a"/>
  
  <!-- Joint 1 Base (KUKA Signature Orange) -->
  <path d="M 54 80 L 56 58 L 68 58 L 66 80 Z" fill="#dd6b20"/>
