  <path d="M 62 58 L 92 34" stroke="#dd6b20" stroke-width="12" stroke-linecap="round"/>
  <path d="M 62 58 L 92 34" stroke="#1a202c" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Joint 2 (Elbow) -->
