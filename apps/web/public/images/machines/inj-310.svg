<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" fill="none">
  <!-- Base Machine Bed -->
  <rect x="10" y="65" width="140" height="25" rx="3" fill="#2d3748"/>
  <rect x="15" y="70" width="130" height="5" fill="#1a202c"/>
  <rect x="25" y="90" width="20" height="5" fill="#1a202c"/>
  <rect x="70" y="90" width="20" height="5" fill="#1a202c"/>
  <rect x="115" y="90" width="20" height="5" fill="#1a202c"/>
  
  <!-- Left: Clamping Unit (Engel Green) -->
  <rect x="15" y="32" width="60" height="34" rx="2" fill="#48bb78"/>
  <rect x="20" y="38" width="22" height="22" rx="1" fill="#2f855a"/>
  <!-- Tie Bars -->
  <line x1="20" y1="42" x2="70" y2="42" stroke="#cbd5e0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="56" x2="70" y2="56" stroke="#cbd5e0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Movable Platen -->
  <rect x="45" y="36" width="10" height="26" rx="1" fill="#718096"/>
  <!-- Stationary Platen -->
  <rect x="68" y="34" width="8" height="30" rx="1" fill="#4a5568"/>
  
  <!-- Right: Injection Unit -->
  <rect x="80" y="42" width="65" height="24" rx="2" fill="#e2e8f0"/>
  <rect x="80" y="45" width="45" height="18" fill="#cbd5e0"/>
  <!-- Barrel & Heater Bands -->
  <rect x="76" y="50" width="12" height="8" fill="#e53e3e"/>
  <rect x="90" y="48" width="6" height="12" fill="#a0aec0"/>
  <rect x="100" y="48" width="6" height="12" fill="#a0aec0"/>
  <rect x="110" y="48" width="6" height="12" fill="#a0aec0"/>
  
  <!-- Feed Hopper -->
  <polygon points="120,20 136,20 132,42 124,42" fill="#a0aec0" stroke="#718096" stroke-width="1"/>
  <polygon points="122,22 134,22 131,38 125,38" fill="#e2e8f0"/>
  
  <!-- Control Panel & Screen -->
  <rect x="25" y="18" width="22" height="14" rx="1" fill="#2d3748"/>
  <rect x="27" y="20" width="18" height="10" rx="1" fill="#63b3ed"/>
  <rect x="34" y="32" width="4" height="6" fill="#4a5568"/>
  
  <!-- Status Light Bar -->
  <circle cx="28" cy="14" r="2" fill="#48bb78"/>
</svg>
