<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" fill="none">
  <!-- Base Machine Bed -->
  <rect x="10" y="66" width="140" height="24" rx="2" fill="#1a365d"/>
  <rect x="15" y="70" width="130" height="4" fill="#0f172a"/>
  <rect x="25" y="90" width="18" height="5" fill="#0f172a"/>
  <rect x="72" y="90" width="18" height="5" fill="#0f172a"/>
  <rect x="118" y="90" width="18" height="5" fill="#0f172a"/>
  
  <!-- Clamping Unit (Sumitomo Blue) -->
  <rect x="14" y="34" width="62" height="33" rx="2" fill="#2b6cb0"/>
  <rect x="18" y="40" width="20" height="20" rx="1" fill="#1a365d"/>
  <line x1="20" y1="44" x2="72" y2="44" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="56" x2="72" y2="56" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <rect x="42" y="38" width="12" height="24" rx="1" fill="#cbd5e0"/>
  <rect x="68" y="36" width="8" height="28" rx="1" fill="#4a5568"/>
  
  <!-- Injection Unit (White / Gray) -->
  <rect x="78" y="42" width="68" height="24" rx="2" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
  <rect x="76" y="50" width="10" height="8" fill="#e53e3e"/>
  <rect x="88" y="47" width="5" height="14" fill="#a0aec0"/>
  <rect x="98" y="47" width="5" height="14" fill="#a0aec0"/>
  <rect x="108" y="47" width="5" height="14" fill="#a0aec0"/>
  
  <!-- Hopper -->
  <polygon points="122,18 140,18 135,42 127,42" fill="#cbd5e0" stroke="#718096" stroke-width="1"/>
  <polygon points="124,20 138,20 134,36 128,36" fill="#edf2f7"/>
  
  <!-- Swivel Display Console -->
  <rect x="30" y="16" width="20" height="14" rx="2" fill="#2d3748"/>
  <rect x="32" y="18" width="16" height="10" rx="1" fill="#f56565"/>
  <rect x="38" y="30" width="4" height="6" fill="#4a5568"/>
  
  <!-- Alert Indicator Dot -->
  <circle cx="33" cy="12" r="2.5" fill="#e53e3e"/>
