<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" fill="none">
  <!-- Base Machine Casting -->
  <rect x="20" y="68" width="120" height="22" rx="2" fill="#1a202c"/>
  <rect x="25" y="73" width="110" height="4" fill="#2d3748"/>
  <rect x="35" y="90" width="18" height="5" fill="#0f172a"/>
  <rect x="108" y="90" width="18" height="5" fill="#0f172a"/>
  
  <!-- Enclosure Body (Mazak Dark Charcoal / Orange Accent) -->
  <rect x="24" y="24" width="112" height="46" rx="3" fill="#2d3748" stroke="#4a5568" stroke-width="1.5"/>
  <rect x="24" y="24" width="112" height="6" fill="#dd6b20"/>
  
  <!-- Sliding Enclosure Window -->
  <rect x="36" y="34" width="62" height="32" rx="2" fill="#0f172a"/>
  <rect x="40" y="37" width="54" height="26" rx="1" fill="#4299e1" fill-opacity="0.25" stroke="#718096" stroke-width="1"/>
  
  <!-- Internal Milling Spindle / Chuck -->
  <circle cx="56" cy="50" r="7" fill="#718096"/>
  <rect x="66" y="44" width="16" height="12" rx="1" fill="#a0aec0"/>
  
  <!-- CNC Operator Station (Right) -->
  <rect x="106" y="32" width="24" height="32" rx="2" fill="#1a202c" stroke="#dd6b20" stroke-width="1"/>
  <rect x="109" y="35" width="18" height="14" rx="1" fill="#e53e3e" fill-opacity="0.8"/>
  <!-- Controls -->
  <line x1="110" y1="53" x2="126" y2="53" stroke="#a0aec0" stroke-width="1"/>
  <circle cx="114" cy="58" r="1.5" fill="#e2e8f0"/>
  <circle cx="120" cy="58" r="1.5" fill="#e2e8f0"/>
  
  <!-- Status Stack Light (Red Breakdown) -->
  <rect x="32" y="14" width="4" height="10" fill="#718096"/>
  <circle cx="34" cy="12" r="2.5" fill="#e53e3e"/>
</svg>
