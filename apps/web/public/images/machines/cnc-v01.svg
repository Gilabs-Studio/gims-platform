<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" fill="none">
  <!-- Base Cabinet & Chip Pan -->
  <rect x="25" y="70" width="110" height="20" rx="2" fill="#2d3748"/>
  <rect x="30" y="75" width="100" height="4" fill="#1a202c"/>
  <rect x="35" y="90" width="20" height="5" fill="#1a202c"/>
  <rect x="105" y="90" width="20" height="5" fill="#1a202c"/>
  
  <!-- Enclosure Main Body (Haas Light Gray/Silver) -->
  <rect x="30" y="25" width="100" height="47" rx="3" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="1.5"/>
  <rect x="30" y="25" width="100" height="8" fill="#4a5568"/>
  
  <!-- Door & Glass Window -->
  <rect x="42" y="35" width="56" height="34" rx="2" fill="#1a202c"/>
  <rect x="46" y="38" width="48" height="28" rx="1" fill="#2b6cb0" fill-opacity="0.3" stroke="#4a5568" stroke-width="1"/>
  
  <!-- Internal Spindle & Table -->
  <rect x="66" y="40" width="8" height="14" fill="#a0aec0"/>
  <polygon points="68,54 72,54 70,58" fill="#e2e8f0"/>
  <rect x="52" y="60" width="36" height="4" fill="#718096"/>
  
  <!-- Control Pendant Unit (Right side) -->
  <rect x="104" y="34" width="20" height="28" rx="2" fill="#2d3748"/>
  <rect x="106" y="36" width="16" height="12" rx="1" fill="#48bb78" fill-opacity="0.9"/>
  <!-- Keypad dots -->
  <circle cx="109" cy="52" r="1" fill="#cbd5e0"/>
  <circle cx="114" cy="52" r="1" fill="#cbd5e0"/>
  <circle cx="119" cy="52" r="1" fill="#cbd5e0"/>
  <circle cx="109" cy="56" r="1" fill="#cbd5e0"/>
  <circle cx="114" cy="56" r="1" fill="#cbd5e0"/>
  <circle cx="119" cy="56" r="1" fill="#cbd5e0"/>
  
  <!-- Pendant Arm -->
  <line x1="114" y1="28" x2="114" y2="34" stroke="#718096" stroke-width="3"/>
  
  <!-- Status Beacon Light -->
  <rect x="38" y="16" width="4" height="9" fill="#718096"/>
  <circle cx="40" cy="14" r="2.5" fill="#48bb78"/>
</svg>
